# Publishes the static viewer (web/dist) to GitHub Pages. Manual only: run it
# from the Actions tab when you decide to publish. Needs Settings > Pages >
# Source: "GitHub Actions". On a public repository the site is public.
name: deploy-viewer

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The display basemap (30 m terrain, Sentinel-2 imagery, WorldCover land cover) is not in git;
      # build it from the open sources (Copernicus DEM and WorldCover on AWS, Earth Search STAC).
      - name: Build the display basemap
        run: npm --prefix web run basemap
      # 3D buildings (OSM via Overpass, Microsoft footprints, Google 2.5D heights). Overpass refuses
      # queries when busy; the viewer runs without buildings, so a failure here does not stop the deploy.
      - name: Build the 3D buildings
        run: npm --prefix web run buildings
        continue-on-error: true
        timeout-minutes: 75
      - run: npm --prefix web run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
